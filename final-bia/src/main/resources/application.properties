spring.application.name=bug-investigation-agent
server.port=8080

# Ollama
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:3b}
ollama.vision-model=${OLLAMA_VISION_MODEL:qwen3-vl:8b-instruct}

# Request limits suitable for large HTML reports.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Pre-Ollama failure grouping: minimum weighted similarity score (0.0-1.0) required to merge a
# failure into an existing group instead of starting a new Ollama investigation for it.
failure.clustering.pre-analysis.threshold=0.80

# Local SQLite database file storing human classification corrections (see
# FailureFeedbackRepository / FailureFeedbackService). Created automatically if missing.
failure.feedback.db-path=/Users/VivekKumar/Report Analyser/ReportInvestigation/data/failure-feedback.db
